<!DOCTYPE html>
<html>
	<head>
		<title>Hello Welcome to my application Records Page</title>
	</head>
	
	<body>
		<h1>Hello World...</h1>
		
		<hr>
		
		<table border="1" align="center" width="50%" style="background-color: aliceblue;">
			<thead>
				<tr>
					<th>Name-</th>
					<th>Age-</th>
					<th>Gender-</th>
					<th>School-</th>
					
				</tr>
				
			</thead>

			<tbody>
				<tr th:each="student : ${records}" align="center">
					
					<td th:text="${student.name}" ></td>
					<td th:if="${student.age <= 10}" th:text="${student.age}" style="color:red"  ></td>
					<td th:unless="${student.age <= 10 }" th:text="${student.age}" style="color:green" ></td>
					
					<td th:switch="${student.gender}" >
						<span th:case="M" th:text="Male" > </span>
						<span th:case="F" th:text="Female" > </span>
						<span th:case="O" th:text="Others" > </span>
					
						</td>
					<td th:text="${student.school}" ></td>
					
				</tr>
			</tbody>
			
		</table>
		
	</body>
	

</html>
